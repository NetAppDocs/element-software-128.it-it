indexpage:
  title: Documentazione del software SolidFire ed Element
  summary: Un sistema di archiviazione all-flash SolidFire è composto da componenti
    hardware quali unità e nodi, combinati in un pool di risorse di archiviazione.  Questo
    cluster unificato, in quanto sistema di storage unico, è gestito tramite il software
    NetApp Element .
  keywords: solidfire, all-flash, storage, hardware, install, maintain, element software,
    esos, element cli
  lead: Un sistema di archiviazione all-flash SolidFire è composto da componenti hardware
    quali unità e nodi, combinati in un pool di risorse di archiviazione.  Utilizzando
    l'interfaccia Element, l'API o altri strumenti di gestione, è possibile gestire
    questi cluster di risorse di storage con il software NetApp Element .  Questo
    sito contiene la documentazione per Element software 12.8.
